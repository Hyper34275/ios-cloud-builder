name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build all platforms
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=$VERSION_TAG" -o dist/builder-darwin-amd64 ./cmd/builder
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$VERSION_TAG" -o dist/builder-darwin-arm64 ./cmd/builder
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$VERSION_TAG" -o dist/builder-linux-amd64 ./cmd/builder
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$VERSION_TAG" -o dist/builder-linux-arm64 ./cmd/builder
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION_TAG" -o dist/builder-windows-amd64.exe ./cmd/builder

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/builder-darwin-amd64
            dist/builder-darwin-arm64
            dist/builder-linux-amd64
            dist/builder-linux-arm64
            dist/builder-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
