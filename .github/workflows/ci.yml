name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited reruns the privacy check when a title or body changes.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    if: github.event.action != 'edited'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        # go.mod requires 1.24, so anything below it silently downloads a 1.24
        # toolchain and tests nothing new. These are the oldest and newest supported.
        go: ['1.24', '1.27']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: go build -v ./cmd/builder

  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The denylist of private names is a secret, so it is masked in this log
      # and never published. The check prints only file and line locations.
      - name: Check the change publishes nothing private
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/privacy-check.sh "$BASE_SHA" "$HEAD_SHA"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # golangci-lint v2.12.2 predates Go 1.27 language changes. Lint with
          # the minimum supported toolchain; the test matrix still covers 1.27.
          go-version: '1.24'
          cache: false

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      # Keep this pinned; upgrade it before linting with a newer Go toolchain.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build all platforms
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/builder-darwin-amd64 ./cmd/builder
          GOOS=darwin GOARCH=arm64 go build -o dist/builder-darwin-arm64 ./cmd/builder
          GOOS=linux GOARCH=amd64 go build -o dist/builder-linux-amd64 ./cmd/builder
          GOOS=linux GOARCH=arm64 go build -o dist/builder-linux-arm64 ./cmd/builder
          GOOS=windows GOARCH=amd64 go build -o dist/builder-windows-amd64.exe ./cmd/builder

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: binaries
          path: dist/
