name: Privacy

# This repository is public. Every pull request is checked for anything that
# would publish private data: personal commit emails, credential-shaped
# tokens, personal emails and home paths, and private names. See
# docs/PRIVACY.md. It runs on any base branch, and again when the title or
# body is edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The denylist of private names is a secret, so it is masked in this log
      # and never published. The check prints only file and line locations.
      - name: Check the change publishes nothing private
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/privacy-check.sh "$BASE_SHA" "$HEAD_SHA"
